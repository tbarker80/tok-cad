        # ── TOK CAD (tok-share.com/cad) — node service tok-cad on 5006 ───────────
        # The app is built for the /cad prefix and the proxy strips it. These locations set
        # their own headers, which stops the server-level CSP from applying here: that policy
        # blocks the WebAssembly CAD kernel ('wasm-unsafe-eval') and its blob: workers.
        location = /cad { return 301 /cad/; }

        # Versioned, immutable assets (~70 on first load): not rate limited.
        location /cad/assets/ {
            proxy_pass         http://127.0.0.1:5006/assets/;
            proxy_set_header   Host $host;
            proxy_set_header   X-Forwarded-Proto https;
            add_header Strict-Transport-Security "max-age=31536000" always;
        }

        # The studio page itself: the app sends its own CSP, allowing its inline scripts by hash.
        location = /cad/ {
            limit_req zone=tokcad burst=60 nodelay;
            proxy_pass         http://127.0.0.1:5006/;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $remote_addr;
            proxy_set_header   X-Forwarded-Proto https;
            add_header Strict-Transport-Security "max-age=31536000" always;
        }

        location /cad/ {
            limit_req zone=tokcad burst=60 nodelay;
            client_max_body_size 2m;
            proxy_pass         http://127.0.0.1:5006/;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $remote_addr;
            proxy_set_header   X-Forwarded-Proto https;
            proxy_read_timeout 120s;          # the agent relay long-polls
            add_header Strict-Transport-Security "max-age=31536000" always;
            add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; font-src 'self' data:; worker-src 'self' blob:; object-src 'none'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;
        }
